name: capsule_note
description: A minimal E-ink capsule note app with i18n and AdMob monetization.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  record: ^5.1.2
  audioplayers: ^6.8.1
  flutter_animate: ^4.5.2
  google_mobile_ads: ^5.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
