name: capsule_note
description: "Capsule Note - Voice Idea Capsules"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  record: ^5.1.2
  audioplayers: ^6.0.0
  flutter_animate: ^4.5.0
  google_mobile_ads: ^5.1.0
  path_provider: ^2.1.6
  flutter_native_splash: ^2.4.4
  sqflite: ^2.4.4
  path: ^1.9.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^3.0.1
  share_plus: ^10.1.3
  file_picker: ^8.1.7
  whisper_ggml: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/models/ggml-tiny-q5_1.bin
dependency_overrides:
  record_platform_interface: 1.2.0
  # Keep web aligned with share_plus / file_picker; record_web resolves via record.
