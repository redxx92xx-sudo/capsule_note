name: capsule_note
description: "Capsule Note - Voice Idea Capsules"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  record: ^5.1.2
  audioplayers: ^6.0.0
  flutter_animate: ^4.5.0
  google_mobile_ads: ^5.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/

dependency_overrides:
  record_platform_interface: 1.2.0
